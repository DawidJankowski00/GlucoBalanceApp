[project]
name = "glucobalance"
version = "0.1.0"
description = "GlucoBalanceApp: a companion app for people with Type 1 diabetes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------- ruff: lint + format ----------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # flake8-simplify
]

# ---------- mypy: type checking ----------
[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
sim = [
    "setuptools<70",
    "simglucose>=0.2.11",
]

# simglucose, pandas (optional "sim" group), pywebpush, apscheduler, scikit-learn and joblib ship
# no type information
[[tool.mypy.overrides]]
module = [
    "simglucose.*", "pandas.*", "pywebpush.*", "apscheduler.*", "sklearn.*", "joblib.*",
]
ignore_missing_imports = true

# ---------- coverage ----------
[tool.coverage.run]
source = ["glucobalance"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

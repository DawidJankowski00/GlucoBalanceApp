services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: glucobalance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: glucobalance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glucobalance"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      GBA_ENVIRONMENT: development
      GBA_SECRET_KEY: ${GBA_SECRET_KEY:-dev-only-secret-change-me}
      GBA_DATABASE_URL: postgresql+psycopg://glucobalance:${POSTGRES_PASSWORD:-change-me}@db:5432/glucobalance
      GBA_VAPID_PRIVATE_KEY: ${GBA_VAPID_PRIVATE_KEY:-}
      GBA_VAPID_PUBLIC_KEY: ${GBA_VAPID_PUBLIC_KEY:-}
      GBA_VAPID_CONTACT: ${GBA_VAPID_CONTACT:-mailto:admin@example.com}
      GBA_CGM_SECRET_KEY: ${GBA_CGM_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

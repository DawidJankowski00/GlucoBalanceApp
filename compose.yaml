services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: glucobalance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: glucobalance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glucobalance"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      GBA_ENVIRONMENT: development
      GBA_DATABASE_URL: postgresql://glucobalance:${POSTGRES_PASSWORD:-change-me}@db:5432/glucobalance
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

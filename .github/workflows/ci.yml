name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published vulnerability in a dependency shows up without a push.
    - cron: "0 6 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage (feeds the README badge)
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secrets scan reads the whole history

      - uses: astral-sh/setup-uv@v5

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uv run --python 3.12 --with pip-audit pip-audit -r requirements-audit.txt --no-deps --disable-pip

      - name: Scan the repository history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

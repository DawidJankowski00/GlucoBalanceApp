<h2 class="mb-2 font-medium">Phone notifications</h2>
<div id="push-box" class="mb-6 rounded border border-slate-200 bg-white p-4 text-sm" hx-boost="false">
  <p id="push-status" class="mb-3 text-slate-700">Checking this device…</p>
  <div class="flex flex-wrap gap-2">
    <button id="push-on" type="button" class="hidden rounded bg-teal-700 px-3 py-2 font-medium text-white">Turn on for this device</button>
    <button id="push-off" type="button" class="hidden rounded border border-slate-300 px-3 py-2">Turn off for this device</button>
    <button id="push-test" type="button" class="hidden rounded border border-teal-700 px-3 py-2 text-teal-800">Send a test</button>
  </div>
  <p class="mt-3 text-xs text-slate-500">Needs HTTPS (or localhost). On iPhone, first add the app to your Home Screen. Reminders always appear in Alerts, with or without this.</p>
</div>
<script>
(function () {
  const status = document.getElementById("push-status");
  const on = document.getElementById("push-on");
  const off = document.getElementById("push-off");
  const test = document.getElementById("push-test");
  const show = (el, yes) => el.classList.toggle("hidden", !yes);

  function keyToBytes(key) {
    const padded = (key + "=".repeat((4 - (key.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    return Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
  }
  async function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
  }

  async function refresh() {
    show(on, false); show(off, false); show(test, false);
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      status.textContent = "This browser cannot receive phone notifications. Reminders still appear in Alerts.";
      return;
    }
    const info = await (await fetch("/push/status")).json();
    if (!info.enabled) {
      status.textContent = "Phone notifications are not set up on this server yet. Reminders still appear in Alerts.";
      return;
    }
    if (Notification.permission === "denied") {
      status.textContent = "Notifications are blocked for this site in your browser settings.";
      return;
    }
    const registration = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    if (subscription) {
      status.textContent = "Phone notifications are on for this device.";
      show(off, true); show(test, true);
    } else {
      status.textContent = "Phone notifications are off for this device.";
      show(on, true);
    }
    on.dataset.key = info.key;
  }

  on.addEventListener("click", async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return refresh();
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: keyToBytes(on.dataset.key),
      });
      const response = await post("/push/subscribe", subscription.toJSON());
      if (!response.ok) {
        await subscription.unsubscribe();
        status.textContent = "Could not turn notifications on. Try again.";
        return;
      }
    } catch (error) {
      status.textContent = "Could not turn notifications on: " + error.message;
      return;
    }
    refresh();
  });

  off.addEventListener("click", async () => {
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    if (subscription) {
      await post("/push/unsubscribe", { endpoint: subscription.endpoint });
      await subscription.unsubscribe();
    }
    refresh();
  });

  test.addEventListener("click", async () => {
    const response = await post("/push/test");
    const result = await response.json().catch(() => ({}));
    status.textContent = response.ok && result.sent > 0
      ? "Test sent. It should arrive in a moment."
      : result.error || "The test could not be delivered.";
  });

  refresh().catch(() => { status.textContent = "Could not check notifications on this device."; });
})();
</script>

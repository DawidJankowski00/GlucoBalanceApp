{% set heat_fill = ["fill-slate-100", "fill-teal-200", "fill-teal-400", "fill-teal-600", "fill-teal-800"] %}
<figure class="mb-4 rounded border border-slate-200 bg-white p-4">
  <svg viewBox="0 0 {{ body_map.width }} {{ body_map.height }}" class="mx-auto w-full max-w-md" role="img" aria-labelledby="body-map-title">
    <title id="body-map-title">Body map: tap a zone to log, block or set a preference</title>
    {% for name, cx in body_map.figures %}
    <g class="fill-slate-50 stroke-slate-300" aria-hidden="true">
      <circle cx="{{ cx }}" cy="32" r="18"/>
      <rect x="{{ cx - 42 }}" y="54" width="84" height="100" rx="14"/>
      <rect x="{{ cx - 62 }}" y="58" width="18" height="84" rx="8"/>
      <rect x="{{ cx + 44 }}" y="58" width="18" height="84" rx="8"/>
      <rect x="{{ cx - 34 }}" y="150" width="32" height="94" rx="10"/>
      <rect x="{{ cx + 2 }}" y="150" width="32" height="94" rx="10"/>
    </g>
    <text x="{{ cx }}" y="{{ body_map.height - 4 }}" text-anchor="middle" class="fill-slate-500 text-[11px]">{{ name }}</text>
    {% endfor %}
    {% for z in body_map.zones %}
    <a href="/sites/zone/{{ z.code }}" hx-get="/sites/zone/{{ z.code }}" hx-target="#zone-panel" hx-swap="innerHTML" hx-push-url="false">
      <rect data-code="{{ z.code }}" data-heat="{{ z.heat }}"{% if z.blocked %} data-blocked="true"{% endif %}
            x="{{ z.x }}" y="{{ z.y }}" width="{{ z.width }}" height="{{ z.height }}" rx="3"
            class="{% if z.blocked %}fill-red-200 stroke-red-700{% else %}{{ heat_fill[z.heat] }} stroke-white{% endif %} cursor-pointer hover:opacity-80"
            stroke-width="{% if z.suggested %}3{% else %}1{% endif %}"{% if z.blocked %} stroke-dasharray="3 2"{% endif %}{% if z.suggested %} style="stroke:#d97706"{% endif %}>
        <title>{{ z.label }}{% if z.blocked %}: not available{% elif z.suggested %}: suggested next{% endif %} · used {{ z.count }} time{% if z.count != 1 %}s{% endif %} in {{ body_map.days }} days</title>
      </rect>
    </a>
    {% endfor %}
  </svg>
  <figcaption class="mt-2 flex flex-wrap gap-3 text-xs text-slate-600">
    <span><span class="inline-block h-3 w-3 rounded-sm bg-slate-100 align-middle"></span> not used</span>
    <span><span class="inline-block h-3 w-3 rounded-sm bg-teal-800 align-middle"></span> used most in the last {{ body_map.days }} days</span>
    <span><span class="inline-block h-3 w-3 rounded-sm border-2 border-amber-600 align-middle"></span> suggested next</span>
    <span><span class="inline-block h-3 w-3 rounded-sm bg-red-200 align-middle"></span> not available</span>
  </figcaption>
  <div id="zone-panel" class="mt-3" aria-live="polite"></div>
</figure>
